name: Build Empire Gym APKs
on:
  push:
    branches: [empire-gym-app]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [member, staff]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      TAG: build-${{ github.run_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        run: npm ci
      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install
      - name: Gradle assembleRelease
        shell: bash
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../build-${{ matrix.variant }}.log
      - name: Rename APK
        if: success()
        run: |
          NAME=EmpireGym-$([ "$APP_VARIANT" = staff ] && echo Staff || echo Member)-v1.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK=$NAME" >> $GITHUB_ENV
      - name: Publish release
        if: always()
        shell: bash
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Empire Gym APKs ($TAG)" --notes "Automated build" --prerelease || true
          tail -c 200000 build-${{ matrix.variant }}.log > log-${{ matrix.variant }}.txt 2>/dev/null || echo "no gradle log" > log-${{ matrix.variant }}.txt
          gh release upload "$TAG" log-${{ matrix.variant }}.txt --clobber
          if [ -n "$APK" ]; then gh release upload "$TAG" "$APK" --clobber; fi
